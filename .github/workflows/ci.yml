name: ci
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    build:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - name: checkout the code
          uses: actions/checkout@v6
        - name: setting up java 21
          uses: actions/setup-java@v5
          with:
              distribution: 'temurin'
              java-version: '21'
              cache: 'maven'
        - name: build with maven
          run: mvn clean verify