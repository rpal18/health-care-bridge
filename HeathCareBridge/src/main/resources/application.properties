spring.application.name=HeathCareBridge

server.port=8081
#configuration for database
spring.datasource.url =jdbc:postgresql://localhost:5432/healthcarebridge
spring.datasource.username=postgres
spring.datasource.password=Rohit@12

# jpa related configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql = true


# datasource initialization
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:data.sql

#logging related configuration
logging.level.org.springframework=DEBUG

#debugging transactional configuration
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
logging.level.org.springframework.transaction.interceptor.TransactionInterceptor=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Jwt related configuration
spring.app.secretKey=MySecretKey848395094509869395965696dfghjkjhgffghjkgfthgutetrtuhuytf6tuy76r6t87t67tyiy6rf8t54r
spring.app.jwtExpirationMs=864000000
spring.app.jwtCookieName=Rp-ecommerceCookie
# setting ai related configuration
spring.ai.openai.api-key=${ai_api_key}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=meta-llama/llama-4-scout-17b-16e-instruct
spring.ai.openai.chat.options.temperature=0.0

# Explicitly set the path for the OpenAPI JSON
springdoc.api-docs.path=/v3/api-docs

# Explicitly set the path for the Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Force Swagger UI to use this specific URL to fetch the docs
springdoc.swagger-ui.url=/v3/api-docs

# Disable Swagger UI from trying to guess paths (helpful if you are behind a proxy)
springdoc.swagger-ui.disable-swagger-default-url=true

server.tomcat.basedir=./temp

#telegram related configuration
telegram.bot.username=ResQBridge_bot
telegram.bot.token=${telegram_api_token}

